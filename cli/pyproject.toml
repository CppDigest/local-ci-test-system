[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localci"
version = "0.1.0"
description = "Local CI - Run GitHub Actions workflows locally"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
localci = "localci.cli.main:cli"

[tool.setuptools.packages.find]
include = ["localci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
