[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localci"
version = "0.1.0"
description = "Local CI - Run GitHub Actions workflows locally"
readme = "README.md"
license = "BSL-1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0.0",
    "types-psutil>=5.9.0",
]

[project.scripts]
localci = "localci.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["localci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: requires act and Docker; runs real subprocesses",
]
norecursedirs = ["integration"]

# Mypy: strict mode for all localci packages (core, utils, cli).
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["localci"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 is handled by ruff format; avoid duplicate line-length enforcement.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["localci"]
