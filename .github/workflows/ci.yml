name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=localci --cov-report=term-missing -m "not integration"

  integration:
    name: Integration (act + Docker)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install act
        env:
          ACT_VERSION: v0.2.76
        run: |
          curl -sSfL -o /tmp/act-install.sh \
            "https://raw.githubusercontent.com/nektos/act/${ACT_VERSION}/install.sh"
          bash /tmp/act-install.sh -b /usr/local/bin "${ACT_VERSION}"
          act --version

      - name: Pull act runner image
        run: docker pull catthehacker/ubuntu:act-24.04

      - name: Run integration tests
        run: pytest tests/integration -m integration -v --tb=short
